name: Monthly PMBI Generic Medicine Sync

on:
  schedule:
    # Runs on the 1st day of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:
    # Allows manual one-click trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-pmbi:
    name: Ingest PMBI Catalog & Update Cloudflare D1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run PMBI Catalog Sync
        run: node scripts/sync-pmbi.mjs

      - name: Execute D1 SQL Migration (Remote Database)
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute salt-matcher-db --remote --file=./scripts/pmbi_monthly_patch.sql

      - name: Commit & push updated SQL patch to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/pmbi_monthly_patch.sql
          git diff --staged --quiet || (git commit -m "chore(data): auto-update PMBI monthly price patch [skip ci]" && git push)
