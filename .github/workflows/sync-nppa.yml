name: NPPA DPCO Price Ceiling Watchdog

on:
  schedule:
    # Runs annually on April 1st and October 1st at 00:00 UTC (Biannual / Annual Gazette updates)
    - cron: '0 0 1 4,10 *'
  workflow_dispatch:
    # Allows manual trigger at any time from the GitHub Actions tab

permissions:
  contents: write

jobs:
  nppa-watchdog:
    name: Check NPPA Ceiling Prices & Update Cloudflare D1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run NPPA DPCO Watchdog Pipeline
        run: node scripts/sync-nppa.mjs

      - name: Execute D1 SQL Patch (Remote Database)
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute salt-matcher-db --remote --file=./scripts/nppa_ceiling_patch.sql || true

      - name: Commit & push updated SQL patch to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/nppa_ceiling_patch.sql
          git diff --staged --quiet || (git commit -m "chore(data): auto-update NPPA DPCO price ceiling schedule [skip ci]" && git push)
